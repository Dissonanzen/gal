<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Galerie</title>
    
    <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --nav-border: #eeeeee;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --nav-border: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--nav-border);
            z-index: 100;
        }

        .nav-left { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            font-weight: bold; 
            font-size: 1.2rem; 
        }
        
        .nav-right { display: flex; gap: 15px; align-items: center; }
        .nav-link { cursor: pointer; text-decoration: none; color: var(--text-color); }
        .nav-link.active { text-decoration: underline; }

        button {
            background: none;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        main {
            margin-top: 60px;
            padding: 20px;
        }

        /* Strenges 4-Spalten Grid-Layout mit dünnen Abständen */
        #gallery-section {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Erzwingt exakt 4 Spalten */
            gap: 5px; /* Dünne Lücke zwischen den Zellen */
            align-items: start; /* Bilder oben in der Zelle ausrichten */
            justify-items: start; /* Bilder links in der Zelle ausrichten */
        }

        #gallery-section img {
            width: 100%; /* Füllt die Spaltenbreite aus */
            height: auto; /* Behält das Originalformat strikt bei */
            display: block;
            cursor: zoom-in;
            transition: opacity 0.2s ease;
        }

        #gallery-section img:hover { opacity: 0.8; }

        #text-section {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 1.1rem;
        }

        #fullscreen-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #fullscreen-img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        .nav-area { position: absolute; top: 0; width: 40%; height: 100%; cursor: pointer; }
        #nav-left { left: 0; cursor: w-resize; }
        #nav-right { right: 0; cursor: e-resize; }
        
        #close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 30px;
            cursor: pointer;
            z-index: 1001;
            color: var(--text-color);
        }

        #image-number {
            position: absolute;
            font-size: 1.2rem;
            font-family: monospace;
            color: var(--text-color);
            z-index: 1002;
            pointer-events: none;
        }

        /* Sorgt für kleinere Spaltenanzahl auf Handys, damit man noch was erkennt */
        @media (max-width: 768px) {
            #gallery-section {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            Mein Name
            <button id="lang-toggle">DE / EN</button>
        </div>
        <div class="nav-right">
            <span class="nav-link active" id="link-bilder">Bilder</span>
            <span class="nav-link" id="link-texte">Texte</span>
            <button id="theme-toggle">Dark Mode</button>
        </div>
    </nav>

    <main>
        <section id="gallery-section"></section>
        <section id="text-section"></section>
    </main>

    <div id="fullscreen-modal">
        <span id="close-btn">&times;</span>
        <div id="image-number"></div>
        <div id="nav-left" class="nav-area"></div>
        <img id="fullscreen-img" src="" alt="Vollbild">
        <div id="nav-right" class="nav-area"></div>
    </div>

    <script>
        // BILDER LISTE
        const imageFiles = [
            "bild1.JPG", "bild2.JPG", "3.JPG", "4.JPG", "5.JPG", 
            "6.JPG", "7.JPG", "8.JPG", "9.JPG", "10.JPG", 
            "11.JPG", "13.JPG", "14.JPG", "P9113375.JPG", "P9113348.JPG", 
            "P9113325.JPG", "P9063241.JPG","P9063234.JPG", "P9063162.JPG", "P9063161.JPG", 
            "P9053138.JPG", "P9053112.JPG", "P9053081.JPG", "P9053039.JPG", "P9042945.JPG", 
            "P9042917.JPG", "P9042852.JPG", "P9042777.JPG", "P9022733.JPG", "P9022714.JPG"
        ];
        
        const gallerySection = document.getElementById('gallery-section');
        const textSection = document.getElementById('text-section');
        const linkBilder = document.getElementById('link-bilder');
        const linkTexte = document.getElementById('link-texte');
        const themeToggle = document.getElementById('theme-toggle');
        const langToggle = document.getElementById('lang-toggle');
        
        const modal = document.getElementById('fullscreen-modal');
        const modalImg = document.getElementById('fullscreen-img');
        const imageNumberEl = document.getElementById('image-number');
        
        let currentIndex = 0;
        
        // SPRACH-LOGIK
        let currentLang = navigator.language.toLowerCase().startsWith('en') ? 'en' : 'de';

        // Funktion zum Ersetzen von \ref{Dateiname} im Text
        function processReferences(text) {
            return text.replace(/\\ref\{([^}]+)\}/g, (match, filename) => {
                const cleanFilename = filename.trim();
                const index = imageFiles.indexOf(cleanFilename);
                if (index !== -1) {
                    // Berechnet die korrekte Nummer (unterstes Bild = 0)
                    return imageFiles.length - 1 - index;
                }
                // Wenn Dateiname nicht in der Liste gefunden wird
                return `[Bild '${cleanFilename}' nicht gefunden]`;
            });
        }

        function updateLangUI() {
            langToggle.innerText = currentLang === 'en' ? 'EN' : 'DE';
            
            const filename = currentLang === 'en' ? 'texts.txt' : 'texte.txt';
            fetch(filename)
                .then(response => {
                    if (!response.ok) throw new Error("Datei nicht gefunden");
                    return response.text();
                })
                .then(text => {
                    // Verarbeitet die \ref{} Platzhalter
                    const processedText = processReferences(text);
                    textSection.textContent = processedText;
                    
                    // Lädt MathJax für die LaTeX Formeln
                    if (window.MathJax) MathJax.typesetPromise([textSection]);
                })
                .catch(error => {
                    textSection.textContent = `Hinweis: Lade eine Datei namens '${filename}' hoch.\n\n(Wenn du dies lokal auf deinem PC siehst: Dein Browser blockiert das Auslesen der Textdatei aus Sicherheitsgründen. Lade die Dateien auf GitHub hoch, dann funktioniert es automatisch!)`;
                });
        }

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            updateLangUI();
            if(modal.style.display === 'flex') updateImageNumber(); 
        });

        // Tab Navigation
        linkBilder.addEventListener('click', () => {
            gallerySection.style.display = 'grid'; 
            textSection.style.display = 'none';
            linkBilder.classList.add('active');
            linkTexte.classList.remove('active');
        });

        linkTexte.addEventListener('click', () => {
            gallerySection.style.display = 'none';
            textSection.style.display = 'block';
            linkTexte.classList.add('active');
            linkBilder.classList.remove('active');
        });

        // Galerie generieren
        imageFiles.forEach((filename, index) => {
            const imgElement = document.createElement('img');
            imgElement.src = `images/${filename}`;
            imgElement.alt = filename;
            imgElement.addEventListener('click', () => {
                currentIndex = index;
                modalImg.src = `images/${imageFiles[currentIndex]}`;
                modal.style.display = 'flex';
                updateImageNumber();
            });
            gallerySection.appendChild(imgElement);
        });

        // Zufällige Platzierung der Bildnummer
        function updateImageNumber() {
            const imgNum = imageFiles.length - 1 - currentIndex;
            const prefix = currentLang === 'en' ? 'Image' : 'Bild';
            imageNumberEl.innerText = `${prefix}: ${imgNum}`;
            
            const isLeft = Math.random() > 0.5;
            const randomX = isLeft ? Math.random() * 15 + 5 : Math.random() * 15 + 80;
            const randomY = Math.random() * 80 + 10;
            
            imageNumberEl.style.left = `${randomX}vw`;
            imageNumberEl.style.top = `${randomY}vh`;
        }

        // Vollbild Navigation
        document.getElementById('close-btn').addEventListener('click', () => modal.style.display = 'none');
        document.getElementById('nav-right').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % imageFiles.length;
            modalImg.src = `images/${imageFiles[currentIndex]}`;
            updateImageNumber();
        });
        document.getElementById('nav-left').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + imageFiles.length) % imageFiles.length;
            modalImg.src = `images/${imageFiles[currentIndex]}`;
            updateImageNumber();
        });

        document.addEventListener('keydown', (event) => {
            if (modal.style.display === 'flex') {
                if (event.key === 'ArrowRight') document.getElementById('nav-right').click();
                if (event.key === 'ArrowLeft') document.getElementById('nav-left').click();
                if (event.key === 'Escape') modal.style.display = 'none';
            }
        });

        // Dark Mode
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.innerText = 'Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.innerText = 'Light Mode';
            }
        });

        // Start
        updateLangUI();
    </script>
</body>
</html>
