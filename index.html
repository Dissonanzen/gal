<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n paar fotos </title>
    
    <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --nav-border: #eeeeee;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --nav-border: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        body.no-scroll {
            overflow: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--nav-border);
            z-index: 100;
        }

        .nav-left { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            font-weight: bold; 
            font-size: 1.2rem; 
        }
        
        .nav-right { display: flex; gap: 15px; align-items: center; }
        
        .nav-link { 
            cursor: pointer; 
            text-decoration: none; 
            color: var(--text-color); 
            position: relative;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: var(--text-color);
            transform-origin: bottom right;
            transition: transform 0.25s ease-out;
        }
        .nav-link:hover::after, .nav-link.active::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        button {
            background: none;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 0; 
            font-size: 0.8rem;
            text-transform: uppercase; 
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        button:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }
        
        /* Der Sprach-Button ist standardmäßig versteckt */
        #lang-toggle {
            display: none;
        }

        main {
            margin-top: 60px;
            padding: 20px;
        }

        #key-form {
            position: fixed;
            top: 75px;
            left: 20px;
            z-index: 99;
        }

        #key-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--nav-border);
            color: var(--text-color);
            outline: none;
            width: 100px;
            font-family: inherit;
            font-size: 0.9rem;
            padding: 2px 0;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px; 
            align-items: start;
            justify-items: start;
        }

        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
        }

        .gallery-grid img {
            width: 100%;
            height: auto;
            display: block;
            cursor: zoom-in;
            transition: opacity 0.2s ease;
        }

        .gallery-grid img:hover { opacity: 0.8; }

        .text-content {
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 1.1rem;
            padding-bottom: 50px;
        }

        #gallery-section, #text-section, #tbd-area { display: none; }
        
        a {
            color: var(--text-color);
            text-decoration: underline;
        }

        #fullscreen-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #fullscreen-img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        .nav-area { position: absolute; top: 0; width: 40%; height: 100%; cursor: pointer; z-index: 1001; }
        #nav-left { left: 0; cursor: w-resize; }
        #nav-right { right: 0; cursor: e-resize; }
        
        #close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 30px;
            cursor: pointer;
            z-index: 1004;
            color: var(--text-color);
            mix-blend-mode: difference;
        }

        #image-number {
            position: absolute;
            font-size: 1.2rem;
            font-family: monospace;
            color: #ffffff; 
            mix-blend-mode: difference;
            z-index: 1002;
            pointer-events: none;
        }

        #image-text {
            position: absolute;
            font-size: 1rem;
            color: var(--text-color);
            z-index: 1005; 
            pointer-events: auto;
            max-width: 90vw; 
            word-wrap: break-word;
            line-height: 1.4;
        }

        @media (min-width: 768px) {
            #image-text {
                max-width: 15vw; 
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            Mein Name
            <button id="lang-toggle">DE</button>
        </div>
        <div class="nav-right">
            <span class="nav-link active" id="link-bilder">Bilder</span>
            <span class="nav-link" id="link-texte">Texte</span>
            <span class="nav-link" id="link-tbd">tbd</span>
            <button id="theme-toggle">Dark Mode</button>
        </div>
    </nav>

    <main>
        <section id="gallery-section" class="gallery-grid"></section>
        <section id="text-section" class="text-content"></section>

        <section id="tbd-area">
            <form id="key-form">
                <input type="text" id="key-input" autocomplete="off" spellcheck="false">
            </form>
            <div id="tbd-gallery" class="gallery-grid"></div>
            <div id="tbd-text" class="text-content" style="margin-top: 50px;"></div>
        </section>
    </main>

    <div id="fullscreen-modal">
        <span id="close-btn">&times;</span>
        <div id="image-number"></div>
        <div id="image-text"></div>
        <div id="nav-left" class="nav-area"></div>
        <img id="fullscreen-img" src="" alt="Vollbild">
        <div id="nav-right" class="nav-area"></div>
    </div>

    <script>
        const secretKey = "agave";

        const imageFiles = [["P9224324.JPG",""], 
                            ["P9204094.JPG",""],
            ["bild1.JPG", ""], //"Ein kleines Zitat hier. <a href='https://github.com' target='_blank'>Mein Link</a>"
            ["bild2.JPG", ""],
            ["3.JPG", ""],
            ["4.JPG", ""],
            ["5.JPG", ""],
            ["6.JPG", ""],
            ["7.JPG", ""],
            ["8.JPG", ""],
            ["9.JPG", ""],
            ["10.JPG", ""],
            ["11.JPG", ""],
            ["13.JPG", ""],
            ["14.JPG", ""],
            ["P9113375.JPG", ""],
            ["P9113348.JPG", ""],
            ["P9113325.JPG", ""],
            ["P9063241.JPG", ""],
            ["P9063234.JPG", ""],
            ["P9063162.JPG", ""],
            ["P9063161.JPG", ""],
            ["P9053138.JPG", ""],
            ["P9053112.JPG", ""],
            ["P9053081.JPG", ""],
            ["P9053039.JPG", ""],
            ["P9042945.JPG", ""],
            ["P9042917.JPG", ""],
            ["P9042852.JPG", ""],
            ["P9042777.JPG", ""],
            ["P9022733.JPG", ""],
            ["P9022714.JPG", ""],
            ["P9204078.JPG","P9224149.JPG"],
            ["P9224149.JPG","P9224149.JPG"]
        ];



        const tbdImages = [];
        
        const gallerySection = document.getElementById('gallery-section');
        const textSection = document.getElementById('text-section');
        const tbdArea = document.getElementById('tbd-area');
        const tbdGallery = document.getElementById('tbd-gallery');
        const tbdText = document.getElementById('tbd-text');
        
        const linkBilder = document.getElementById('link-bilder');
        const linkTexte = document.getElementById('link-texte');
        const linkTbd = document.getElementById('link-tbd');
        const themeToggle = document.getElementById('theme-toggle');
        const langToggle = document.getElementById('lang-toggle');
        
        const modal = document.getElementById('fullscreen-modal');
        const modalImg = document.getElementById('fullscreen-img');
        const imageNumberEl = document.getElementById('image-number');
        const imageTextEl = document.getElementById('image-text');
        
        const keyForm = document.getElementById('key-form');
        const keyInput = document.getElementById('key-input');
        
        let currentIndex = 0;
        let isTbdMode = false;
        let isTbdUnlocked = false;
        
        let currentLang = navigator.language.toLowerCase().startsWith('en') ? 'en' : 'de';

        function parseReferences(rawText) {
            return rawText.replace(/\\ref\{([^}]+)\}/g, (match, filename) => {
                let index = imageFiles.findIndex(item => item[0] === filename);
                let prefix = currentLang === 'en' ? 'Image' : 'Bild';
                let tbdStr = "";
                
                if (index === -1) {
                    index = tbdImages.findIndex(item => item[0] === filename);
                    if (index !== -1) {
                        index = tbdImages.length - 1 - index;
                        tbdStr = "tbd";
                    }
                } else {
                    index = imageFiles.length - 1 - index;
                }

                if (index !== -1) {
                    return `${prefix}: ${tbdStr}${index}`;
                }
                return match;
            });
        }

        function loadTextFile(filename, element) {
            fetch(filename)
                .then(response => {
                    if (!response.ok) throw new Error("Datei nicht gefunden");
                    return response.text();
                })
                .then(text => {
                    element.innerHTML = parseReferences(text);
                    if (window.MathJax) MathJax.typesetPromise([element]);
                })
                .catch(error => {
                    element.innerHTML = `Hinweis: Datei '${filename}' nicht gefunden.`;
                });
        }

        function updateLangUI() {
            langToggle.innerText = currentLang === 'en' ? 'EN' : 'DE';
            
            // TITEL SPRACHABHÄNGIG ANPASSEN
            document.title = currentLang === 'en' ? 'a few photos' : 'n paar bilder';
            
            loadTextFile(currentLang === 'en' ? 'texts.txt' : 'texte.txt', textSection);
            if (isTbdUnlocked) {
                loadTextFile(currentLang === 'en' ? 'textstbd.txt' : 'textstbd.txt', tbdText);
            }
        }

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            updateLangUI();
            if (modal.style.display === 'flex') updateFullscreenMeta(); 
        });

        function resetNav() {
            linkBilder.classList.remove('active');
            linkTexte.classList.remove('active');
            linkTbd.classList.remove('active');
            gallerySection.style.display = 'none';
            textSection.style.display = 'none';
            tbdArea.style.display = 'none';
            keyForm.style.display = 'none';
            
            // Sprachbutton standardmäßig auf anderen Seiten verstecken
            langToggle.style.display = 'none';
            
            isTbdMode = false;
        }

        linkBilder.addEventListener('click', () => {
            resetNav();
            linkBilder.classList.add('active');
            gallerySection.style.display = 'grid';
        });

        linkTexte.addEventListener('click', () => {
            resetNav();
            linkTexte.classList.add('active');
            textSection.style.display = 'block';
            
            // Sprachbutton nur hier anzeigen
            langToggle.style.display = 'inline-block';
        });

        linkTbd.addEventListener('click', () => {
            resetNav();
            linkTbd.classList.add('active');
            tbdArea.style.display = 'block';
            isTbdMode = true;
            
            if (!isTbdUnlocked) {
                keyForm.style.display = 'block';
                tbdGallery.style.display = 'none';
                tbdText.style.display = 'none';
                keyInput.focus();
            } else {
                tbdGallery.style.display = 'grid';
                tbdText.style.display = 'block';
            }
        });

        keyForm.addEventListener('submit', (e) => {
            e.preventDefault(); 
            if (keyInput.value.toLowerCase() === secretKey.toLowerCase()) {
                isTbdUnlocked = true;
                keyForm.style.display = 'none';
                tbdGallery.style.display = 'grid';
                tbdText.style.display = 'block';
                updateLangUI();
            }
        });

        function renderGallery(dataArray, container) {
            container.innerHTML = '';
            dataArray.forEach((item, index) => {
                const filename = item[0];
                const imgElement = document.createElement('img');
                imgElement.src = `images/${filename}`;
                imgElement.alt = filename;
                imgElement.addEventListener('click', () => {
                    currentIndex = index;
                    openFullscreen();
                });
                container.appendChild(imgElement);
            });
        }

        renderGallery(imageFiles, gallerySection);
        renderGallery(tbdImages, tbdGallery);

        resetNav();
        linkBilder.click(); // Startet automatisch auf der Bilder-Seite

        function openFullscreen() {
            modal.style.display = 'flex';
            document.body.classList.add('no-scroll');
            updateFullscreenMeta();
        }

        function updateFullscreenMeta() {
            const currentArray = isTbdMode ? tbdImages : imageFiles;
            if (currentArray.length === 0) return;
            
            const currentItem = currentArray[currentIndex];
            const filename = currentItem[0];
            const captionText = currentItem[1]; 

            modalImg.src = `images/${filename}`;
            
            const imgNum = currentArray.length - 1 - currentIndex;
            const prefix = currentLang === 'en' ? 'Image' : 'Bild';
            const tbdStr = isTbdMode ? 'tbd' : '';
            imageNumberEl.innerText = `${prefix}: ${tbdStr}${imgNum}`;
            
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile) {
                const isTop = Math.random() > 0.5;
                imageNumberEl.style.left = '50vw';
                imageNumberEl.style.transform = 'translateX(-50%)'; 
                imageNumberEl.style.top = isTop ? '15vh' : '85vh';
                
                if (captionText && captionText.trim() !== "") {
                    imageTextEl.innerHTML = captionText;
                    imageTextEl.style.display = 'block';
                    
                    imageTextEl.style.transform = 'none'; 
                    imageTextEl.style.left = '5vw';
                    imageTextEl.style.right = '5vw';
                    imageTextEl.style.textAlign = 'center';
                    
                    imageTextEl.style.top = isTop ? '75vh' : '20vh';
                } else {
                    imageTextEl.style.display = 'none';
                }
                
            } else {
                imageNumberEl.style.transform = 'none'; 
                
                const isNumberLeft = Math.random() > 0.5;
                const isOutside = Math.random() < 0.70;
                
                let numX;
                if (isOutside) {
                    numX = isNumberLeft ? Math.random() * 15 + 2 : Math.random() * 15 + 80;
                } else {
                    numX = Math.random() * 40 + 30; 
                }
                const numY = Math.random() * 80 + 10;
                
                imageNumberEl.style.left = `${numX}vw`;
                imageNumberEl.style.top = `${numY}vh`;

                if (captionText && captionText.trim() !== "") {
                    imageTextEl.innerHTML = captionText;
                    imageTextEl.style.display = 'block';
                    imageTextEl.style.transform = 'none';
                    
                    const isTextLeft = Math.random() > 0.5;
                    const textY = Math.random() * 80 + 10;
                    imageTextEl.style.top = `${textY}vh`;
                    
                    if (isTextLeft) {
                        const textX = Math.random() * 5 + 2; 
                        imageTextEl.style.left = `${textX}vw`;
                        imageTextEl.style.right = 'auto';
                        imageTextEl.style.textAlign = 'left';
                    } else {
                        const textX = Math.random() * 5 + 2; 
                        imageTextEl.style.right = `${textX}vw`;
                        imageTextEl.style.left = 'auto';
                        imageTextEl.style.textAlign = 'right';
                    }
                } else {
                    imageTextEl.style.display = 'none';
                }
            }
        }

        document.getElementById('close-btn').addEventListener('click', () => {
            modal.style.display = 'none';
            document.body.classList.remove('no-scroll');
        });

        document.getElementById('nav-right').addEventListener('click', () => {
            const currentArray = isTbdMode ? tbdImages : imageFiles;
            if(currentArray.length > 0) {
                currentIndex = (currentIndex + 1) % currentArray.length;
                updateFullscreenMeta();
            }
        });

        document.getElementById('nav-left').addEventListener('click', () => {
            const currentArray = isTbdMode ? tbdImages : imageFiles;
            if(currentArray.length > 0) {
                currentIndex = (currentIndex - 1 + currentArray.length) % currentArray.length;
                updateFullscreenMeta();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (modal.style.display === 'flex') {
                if (event.key === 'ArrowRight') document.getElementById('nav-right').click();
                if (event.key === 'ArrowLeft') document.getElementById('nav-left').click();
                if (event.key === 'Escape') document.getElementById('close-btn').click();
            }
        });

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.innerText = 'Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.innerText = 'Light Mode';
            }
        });

        updateLangUI();
        
        window.addEventListener('resize', () => {
            if(modal.style.display === 'flex') {
                updateFullscreenMeta();
            }
        });
    </script>
</body>
</html>
