<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Galerie</title>
    
    <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --nav-border: #eeeeee;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --nav-border: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Body Scroll blockieren für Vollbild */
        body.no-scroll {
            overflow: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--nav-border);
            z-index: 100;
        }

        .nav-left { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            font-weight: bold; 
            font-size: 1.2rem; 
        }
        
        .nav-right { display: flex; gap: 15px; align-items: center; }
        .nav-link { 
            cursor: pointer; 
            text-decoration: none; 
            color: var(--text-color); 
            position: relative;
            padding-bottom: 2px;
        }
        
        /* Elegante Unterstreichung */
        .nav-link::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: var(--text-color);
            transform: scaleX(0);
            transition: transform 0.2s ease;
        }
        .nav-link:hover::after, .nav-link.active::after {
            transform: scaleX(1);
        }

        /* Eckige, minimalistische Buttons */
        button {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 0;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        main {
            margin-top: 60px;
            padding: 20px;
        }

        /* Strenges Grid-Layout für beide Galerien */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px; /* Dünne Abstände */
            align-items: start;
            justify-items: start;
        }

        .gallery-grid img {
            width: 100%;
            height: auto;
            display: block;
            cursor: zoom-in;
            transition: opacity 0.2s ease;
        }

        .gallery-grid img:hover { opacity: 0.8; }

        .text-content {
            max-width: 800px;
            margin: 40px auto 0 auto;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 1.1rem;
        }

        /* Sektionen */
        #gallery-section { display: grid; } /* Startansicht */
        #text-section, #tbd-section, #tbd-content { display: none; }

        /* TBD Lock Screen */
        #tbd-section {
            /* Positioniert das Rechteck oben links (unter der Navbar) */
            padding-top: 10px;
        }

        /* Minimalistisches Rechteck, keine Effekte */
        #password-input {
            width: 150px;
            padding: 8px;
            font-size: 1rem;
            font-family: monospace;
            border: 1px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            outline: none;
        }

        /* Vollbild Modus */
        #fullscreen-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #fullscreen-img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        .nav-area { position: absolute; top: 0; width: 40%; height: 100%; cursor: pointer; }
        #nav-left { left: 0; cursor: w-resize; }
        #nav-right { right: 0; cursor: e-resize; }
        
        #close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 30px;
            cursor: pointer;
            z-index: 1001;
            color: var(--text-color);
        }

        #image-number {
            position: absolute;
            font-size: 1.2rem;
            font-family: monospace;
            color: var(--text-color);
            z-index: 1002;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            Mein Name
            <button id="lang-toggle">DE / EN</button>
        </div>
        <div class="nav-right">
            <span class="nav-link active" id="link-bilder">Bilder</span>
            <span class="nav-link" id="link-texte">Texte</span>
            <span class="nav-link" id="link-tbd">tbd</span>
            <button id="theme-toggle">Dark Mode</button>
        </div>
    </nav>

    <main>
        <!-- Standard Bilder -->
        <section id="gallery-section" class="gallery-grid"></section>
        
        <!-- Standard Texte -->
        <section id="text-section" class="text-content"></section>

        <!-- TBD Bereich -->
        <section id="tbd-section">
            <input type="text" id="password-input" autocomplete="off">
        </section>

        <!-- Geheimer TBD Content (Bilder + Text drunter) -->
        <section id="tbd-content">
            <div id="tbd-gallery" class="gallery-grid"></div>
            <div id="tbd-text" class="text-content"></div>
        </section>
    </main>

    <div id="fullscreen-modal">
        <span id="close-btn">&times;</span>
        <div id="image-number"></div>
        <div id="nav-left" class="nav-area"></div>
        <img id="fullscreen-img" src="" alt="Vollbild">
        <div id="nav-right" class="nav-area"></div>
    </div>

    <script>
        // --- KONFIGURATION ---
        const secretPassword = "agave"; // HIER PASSWORT ÄNDERN

        const imageFiles = [
            "bild1.JPG", "bild2.JPG", "3.JPG", "4.JPG", "5.JPG", 
            "6.JPG", "7.JPG", "8.JPG", "9.JPG", "10.JPG", 
            "11.JPG", "13.JPG", "14.JPG", "P9113375.JPG", "P9113348.JPG", 
            "P9113325.JPG", "P9063241.JPG","P9063234.JPG", "P9063162.JPG", 
            "P9063161.JPG", "P9053138.JPG", "P9053112.JPG", "P9053081.JPG", 
            "P9053039.JPG", "P9042945.JPG", "P9042917.JPG", "P9042852.JPG", 
            "P9042777.JPG", "P9022733.JPG", "P9022714.JPG"
        ];
        
        const tbdImages = [
            // "geheim1.jpg",
            // "geheim2.jpg"
        ];
        
        // --- ELEMENTE ---
        const gallerySection = document.getElementById('gallery-section');
        const textSection = document.getElementById('text-section');
        const tbdSection = document.getElementById('tbd-section');
        const tbdContent = document.getElementById('tbd-content');
        const tbdGallery = document.getElementById('tbd-gallery');
        const tbdText = document.getElementById('tbd-text');
        const passwordInput = document.getElementById('password-input');
        
        const linkBilder = document.getElementById('link-bilder');
        const linkTexte = document.getElementById('link-texte');
        const linkTbd = document.getElementById('link-tbd');
        
        const themeToggle = document.getElementById('theme-toggle');
        const langToggle = document.getElementById('lang-toggle');
        
        const modal = document.getElementById('fullscreen-modal');
        const modalImg = document.getElementById('fullscreen-img');
        const imageNumberEl = document.getElementById('image-number');
        
        // --- STATUS VARIABLEN ---
        let currentLang = navigator.language.toLowerCase().startsWith('en') ? 'en' : 'de';
        let currentIndex = 0;
        let activeImageArray = imageFiles; // Speichert, ob wir gerade in der normalen oder geheimen Galerie blättern
        let tbdUnlocked = false;

        // --- HILFSFUNKTIONEN ---
        function setActiveTab(clickedLink) {
            [linkBilder, linkTexte, linkTbd].forEach(link => link.classList.remove('active'));
            clickedLink.classList.add('active');
            
            gallerySection.style.display = 'none';
            textSection.style.display = 'none';
            tbdSection.style.display = 'none';
            tbdContent.style.display = 'none';
        }

        // --- PASSWORT LOGIK ---
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (passwordInput.value === secretPassword) {
                    tbdUnlocked = true;
                    tbdSection.style.display = 'none';
                    tbdContent.style.display = 'block';
                    loadTextFile(tbdText, currentLang === 'en' ? 'textstbd.txt' : 'texttbd.txt');
                }
                // Wenn falsch: Keine Reaktion, kein rotes Aufblitzen, einfach nichts.
            }
        });

        // --- NAVIGATION ---
        linkBilder.addEventListener('click', () => {
            setActiveTab(linkBilder);
            gallerySection.style.display = 'grid';
            activeImageArray = imageFiles;
        });

        linkTexte.addEventListener('click', () => {
            setActiveTab(linkTexte);
            textSection.style.display = 'block';
        });

        linkTbd.addEventListener('click', () => {
            setActiveTab(linkTbd);
            activeImageArray = tbdImages;
            if (tbdUnlocked) {
                tbdContent.style.display = 'block';
            } else {
                tbdSection.style.display = 'block';
                passwordInput.value = ''; // Feld leeren bei neuem Aufruf
                passwordInput.focus();
            }
        });

        // --- TEXTE & \ref{} PARSER ---
        function parseRefs(text) {
            return text.replace(/\\ref\{([^}]+)\}/g, (match, filename) => {
                let imgNum = imageFiles.length - 1 - imageFiles.indexOf(filename);
                if (imageFiles.indexOf(filename) === -1) {
                    imgNum = tbdImages.length - 1 - tbdImages.indexOf(filename);
                }
                return imgNum !== -1 ? imgNum : "[Bild nicht gefunden]";
            });
        }

        function loadTextFile(targetElement, filename) {
            fetch(filename)
                .then(response => {
                    if (!response.ok) throw new Error("Datei nicht gefunden");
                    return response.text();
                })
                .then(text => {
                    targetElement.textContent = parseRefs(text);
                    if (window.MathJax) MathJax.typesetPromise([targetElement]);
                })
                .catch(error => {
                    targetElement.textContent = `Hinweis: Lade '${filename}' hoch.`;
                });
        }

        function updateLangUI() {
            langToggle.innerText = currentLang === 'en' ? 'EN' : 'DE';
            loadTextFile(textSection, currentLang === 'en' ? 'texts.txt' : 'texte.txt');
            if (tbdUnlocked) {
                loadTextFile(tbdText, currentLang === 'en' ? 'textstbd.txt' : 'texttbd.txt');
            }
        }

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            updateLangUI();
            if(modal.style.display === 'flex') updateImageNumber(); 
        });

        // --- GALERIE GENERIEREN ---
        function createGallery(imgArray, container) {
            imgArray.forEach((filename, index) => {
                const imgElement = document.createElement('img');
                imgElement.src = `images/${filename}`;
                imgElement.alt = filename;
                imgElement.addEventListener('click', () => {
                    activeImageArray = imgArray;
                    currentIndex = index;
                    modalImg.src = `images/${activeImageArray[currentIndex]}`;
                    modal.style.display = 'flex';
                    document.body.classList.add('no-scroll');
                    updateImageNumber();
                });
                container.appendChild(imgElement);
            });
        }

        createGallery(imageFiles, gallerySection);
        createGallery(tbdImages, tbdGallery);

        // --- VOLLBILD LOGIK ---
        function updateImageNumber() {
            const imgNum = activeImageArray.length - 1 - currentIndex;
            const prefix = currentLang === 'en' ? 'Image' : 'Bild';
            imageNumberEl.innerText = `${prefix}: ${imgNum}`;
            
            const isLeft = Math.random() > 0.5;
            const randomX = isLeft ? Math.random() * 15 + 5 : Math.random() * 15 + 80;
            const randomY = Math.random() * 80 + 10;
            
            imageNumberEl.style.left = `${randomX}vw`;
            imageNumberEl.style.top = `${randomY}vh`;
        }

        function closeFullscreen() {
            modal.style.display = 'none';
            document.body.classList.remove('no-scroll');
        }

        document.getElementById('close-btn').addEventListener('click', closeFullscreen);
        
        document.getElementById('nav-right').addEventListener('click', () => {
            if(activeImageArray.length === 0) return;
            currentIndex = (currentIndex + 1) % activeImageArray.length;
            modalImg.src = `images/${activeImageArray[currentIndex]}`;
            updateImageNumber();
        });
        
        document.getElementById('nav-left').addEventListener('click', () => {
            if(activeImageArray.length === 0) return;
            currentIndex = (currentIndex - 1 + activeImageArray.length) % activeImageArray.length;
            modalImg.src = `images/${activeImageArray[currentIndex]}`;
            updateImageNumber();
        });

        document.addEventListener('keydown', (event) => {
            if (modal.style.display === 'flex') {
                if (event.key === 'ArrowRight') document.getElementById('nav-right').click();
                if (event.key === 'ArrowLeft') document.getElementById('nav-left').click();
                if (event.key === 'Escape') closeFullscreen();
            }
        });

        // --- DARK MODE ---
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.innerText = 'Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.innerText = 'Light Mode';
            }
        });

        // --- INIT ---
        updateLangUI();
    </script>
</body>
</html>
